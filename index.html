<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL Game Show</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Three.js para o 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --neon-pink: #ec4899;
            --neon-purple: #1e092b;
            --neon-cyan: #38bdf8;
            --neon-yellow: #eab308;
            --neon-green: #22c55e;
            --neon-red: #ef4444;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Full screen 3D app */
            font-family: 'Rajdhani', sans-serif;
            background: radial-gradient(circle at center, #0f051d 0%, #05010a 70%, #000000 100%);
            color: white;
        }

        /* 3D Canvas Background */
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* UI Layer on top of 3D */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Re-enable pointer events for specific UI elements */
        .interactive-ui {
            pointer-events: auto;
        }

        h1, h2, h3, h4, .font-orbitron { font-family: 'Orbitron', sans-serif; }
        code, pre, .font-fira, input { font-family: 'Fira Code', monospace; }

        /* Premium Cyber-Glassmorphism */
        .glass-panel {
            background: rgba(12, 6, 24, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(56, 189, 248, 0.05);
        }

        /* Cyber Neon Buttons */
        .btn-neon {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 12px 24px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.2s ease-in-out;
            background: rgba(20, 10, 35, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
        }

        .btn-neon:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .btn-neon-pink:not(:disabled):hover {
            background: #ec4899;
            box-shadow: 0 0 25px rgba(236,72,153,0.8);
            border-color: #ec4899;
            transform: translateY(-2px);
        }

        .btn-neon-cyan:not(:disabled):hover {
            background: #38bdf8;
            box-shadow: 0 0 25px rgba(56,189,248,0.8);
            border-color: #38bdf8;
            color: #000;
            transform: translateY(-2px);
        }

        .btn-neon-green:not(:disabled):hover {
            background: #22c55e;
            box-shadow: 0 0 25px rgba(34,197,94,0.8);
            border-color: #22c55e;
            transform: translateY(-2px);
        }

        .btn-neon-red:not(:disabled):hover {
            background: #ef4444;
            box-shadow: 0 0 25px rgba(239,68,68,0.8);
            border-color: #ef4444;
            transform: translateY(-2px);
        }

        /* Custom Terminal Input */
        .terminal-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #38bdf8;
            color: #38bdf8;
            padding: 14px 18px;
            font-size: 1.1rem;
            border-radius: 12px;
            outline: none;
            box-shadow: inset 0 0 12px rgba(56, 189, 248, 0.3);
            transition: all 0.3s;
        }
        .terminal-input:focus {
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.6), 0 0 20px rgba(56, 189, 248, 0.5);
            border-color: #7dd3fc;
        }

        .hidden { display: none !important; }

        /* Animations */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); }
            50% { box-shadow: 0 0 35px rgba(236, 72, 153, 0.9); }
            100% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); }
        }
        .animate-glow {
            animation: pulse-glow 2s infinite;
        }

        /* Trap Shake Effect */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-6px, 3px); }
            40%, 80% { transform: translate(6px, -3px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out both;
        }

        /* Glitch Effect for Wrong Answers */
        @keyframes glitchRed {
            0% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.8); }
            50% { transform: translate(-3px, 1px); }
            100% { box-shadow: 0 0 35px rgba(239, 68, 68, 1); transform: translate(0, 0); }
        }
        .animate-glitch-error {
            animation: glitchRed 0.3s ease-in-out infinite alternate;
        }

        /* Pop Banner Animation */
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Scoreboard Table */
        .score-row {
            transition: all 0.25s ease;
        }
        .score-row.active-turn {
            background: rgba(56, 189, 248, 0.2);
            border-left: 4px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer">
        
        <!-- TOP BAR: Ranking -->
        <div class="w-full flex justify-end items-start p-4 md:p-6 interactive-ui">
            <!-- Scoreboard -->
            <div class="glass-panel p-4 rounded-2xl border border-cyan-500/40 min-w-[250px]">
                <h3 class="text-center font-orbitron text-xs text-yellow-400 mb-3 tracking-widest border-b border-cyan-500/30 pb-2">RANKING DO JOGO</h3>
                <div id="scoreboard-list" class="flex flex-col gap-2">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>

        <!-- CENTER START SCREEN -->
        <div id="start-screen" class="absolute inset-0 flex items-center justify-center interactive-ui bg-black/80 backdrop-blur-md z-50">
            <div class="glass-panel p-8 md:p-12 rounded-3xl text-center max-w-xl border-2 border-yellow-400/60 shadow-[0_0_60px_rgba(234,179,8,0.35)]">
                <h2 class="text-5xl md:text-7xl font-orbitron font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-500 to-cyan-400 mb-8 drop-shadow-[0_0_25px_rgba(234,179,8,0.8)]">
                    GAME SHOW
                </h2>
                
                <button onclick="startGame()" class="btn-neon btn-neon-pink px-10 py-5 text-2xl animate-glow shadow-[0_0_30px_rgba(236,72,153,0.8)]">
                    🚀 INICIAR JOGO
                </button>
            </div>
        </div>

        <!-- CHALLENGE MODAL -->
        <div id="challenge-modal" class="absolute inset-0 flex items-center justify-center interactive-ui bg-black/70 backdrop-blur-md z-40 hidden">
            <div id="challenge-box" class="glass-panel p-8 md:p-10 rounded-3xl text-center max-w-2xl w-full border-2 border-cyan-500/60 shadow-[0_0_40px_rgba(56,189,248,0.3)] transition-all duration-300 overflow-y-auto max-h-[90vh]">
                <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                    <span class="text-cyan-400 font-orbitron font-bold text-xl" id="challenge-team-name">Equipe X</span>
                    
                    <!-- Timer UI -->
                    <div id="challenge-timer" class="w-12 h-12 bg-black/80 rounded-full border-2 border-cyan-500 flex items-center justify-center text-xl font-bold font-orbitron text-cyan-400 shadow-[0_0_12px_rgba(56,189,248,0.4)] hidden">
                        45
                    </div>

                    <span class="bg-yellow-500/20 text-yellow-300 px-3 py-1.5 rounded-lg text-sm font-fira border border-yellow-500/40" id="points-badge"><span id="challenge-points">100</span> pts</span>
                </div>

                <h3 class="text-xl md:text-3xl font-semibold mb-6 leading-relaxed text-cyan-50 drop-shadow-sm" id="challenge-question">
                    Carregando desafio...
                </h3>

                <!-- Universal Hint Button -->
                <div id="hint-button-container" class="mb-4">
                    <button onclick="useHint()" id="btn-hint" class="btn-neon text-yellow-400 border-yellow-500/50 hover:bg-yellow-500/20 text-sm">💡 Pedir Dica (-40pts)</button>
                </div>

                <!-- Hint Display Box -->
                <div id="hint-display" class="hidden mb-6 p-4 bg-yellow-950/50 border border-yellow-500/60 rounded-xl text-yellow-200 text-sm font-fira shadow-inner">
                </div>

                <!-- Event Mode (Obstacles / Boosts) -->
                <div id="event-mode-container" class="hidden space-y-4 text-center">
                    <div class="text-7xl mb-2" id="event-icon">💥</div>
                    <div id="event-title-banner" class="text-3xl font-black font-orbitron tracking-wider"></div>
                    <div id="event-desc-text" class="text-lg text-gray-300 font-fira my-2 px-4"></div>
                    <div id="event-result-text" class="text-4xl font-black font-orbitron my-4 drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]"></div>
                    
                    <div class="w-full bg-gray-900/80 rounded-full h-4 overflow-hidden border border-white/20 mb-6 p-0.5">
                        <div id="event-graphic-bar" class="h-full rounded-full transition-all duration-700 w-0"></div>
                    </div>

                    <button onclick="endTurn()" class="btn-neon btn-neon-pink px-8 py-3 text-lg font-orbitron">CONTINUAR ➔</button>
                </div>

                <!-- Input mode -->
                <div id="input-mode-container" class="hidden space-y-4">
                    <input type="text" id="challenge-input" class="terminal-input" placeholder="Digite a resposta..." autocomplete="off" spellcheck="false">
                    <div class="flex justify-end gap-4 mt-6">
                        <button onclick="submitInputAnswer()" class="btn-neon btn-neon-cyan w-full md:w-auto">EXECUTAR</button>
                    </div>
                </div>

                <!-- True/False mode -->
                <div id="tf-mode-container" class="hidden space-y-4">
                    <div class="grid grid-cols-2 gap-6 mt-4">
                        <button onclick="submitTFAnswer(true)" class="btn-neon btn-neon-green text-xl py-6">VERDADEIRO</button>
                        <button onclick="submitTFAnswer(false)" class="btn-neon btn-neon-red text-xl py-6">FALSO</button>
                    </div>
                </div>

                <!-- Result Feedback -->
                <div id="result-feedback" class="hidden mt-6 text-center p-6 rounded-xl font-bold text-2xl font-orbitron border-2">
                </div>

                <!-- Interactive Explanation Toggle Button & Box -->
                <div id="explanation-container" class="hidden mt-4 text-left">
                    <button onclick="toggleExplanation()" id="btn-explain" class="btn-neon text-cyan-300 border-cyan-500/50 hover:bg-cyan-500/20 text-xs w-full py-2 mb-2 flex items-center justify-center gap-2">
                        📖 EXPLICAR RESPOSTA
                    </button>
                    <div id="explanation-box" class="hidden p-4 bg-cyan-950/70 border border-cyan-500/50 rounded-xl text-cyan-100 text-sm font-fira leading-relaxed shadow-inner">
                    </div>
                </div>
                
                <div id="btn-continue" class="hidden mt-6 text-center">
                    <button onclick="endTurn()" class="btn-neon btn-neon-pink w-full">CONTINUAR ➔</button>
                </div>
            </div>
        </div>

        <!-- ENDGAME MODAL -->
        <div id="endgame-modal" class="absolute inset-0 flex items-center justify-center interactive-ui bg-black/90 backdrop-blur-lg z-50 hidden">
            <div class="glass-panel p-10 rounded-3xl text-center max-w-2xl w-full border-2 border-yellow-500 shadow-[0_0_60px_rgba(234,179,8,0.6)] animate-pop">
                <h2 class="text-4xl md:text-5xl font-orbitron font-bold text-yellow-400 mb-2 drop-shadow-[0_0_15px_rgba(234,179,8,0.8)]">FIM DE JOGO</h2>
                <p class="text-yellow-200 text-sm mb-6 font-fira">🏆 O 1º LUGAR GANHOU +50 PONTOS BÔNUS AO CHEGAR NA LINHA DE CHEGADA!</p>

                <h3 class="text-xl font-bold text-white mb-4 border-b border-white/20 pb-2">CLASSIFICAÇÃO GERAL</h3>
                
                <!-- Podium List -->
                <div id="podium-list" class="flex flex-col gap-3 mb-8 w-full max-w-md mx-auto text-left">
                </div>

                <button onclick="location.reload()" class="btn-neon btn-neon-cyan mt-2">JOGAR NOVAMENTE</button>
            </div>
        </div>

        <!-- BOTTOM BAR: Controls -->
        <div class="w-full p-6 interactive-ui flex flex-col md:flex-row justify-center items-center gap-6 bg-gradient-to-t from-black/95 via-black/50 to-transparent pb-8">
            <div id="turn-indicator" class="hidden text-center md:text-right">
                <p id="current-team-display" class="text-2xl md:text-3xl font-bold font-orbitron" style="color: var(--neon-cyan)">Equipe X</p>
            </div>
            
            <button id="btn-roll-dice" onclick="rollDice()" class="hidden btn-neon btn-neon-pink px-8 py-4 text-xl shadow-[0_0_20px_rgba(236,72,153,0.5)]">
                🎲 ROLAR DADO (1-4)
            </button>

            <div id="dice-result" class="hidden text-3xl font-bold font-orbitron bg-black/70 px-6 py-3 rounded-xl border border-cyan-500/50 text-cyan-400 shadow-[0_0_15px_rgba(56,189,248,0.3)]">
                -
            </div>
        </div>
    </div>

    <!-- AUDIO ENGINE & GAME LOGIC -->
    <script>
        // --- DATA & CONTENT WITH DETAILED EXPLANATIONS ---
        const teamsData = [
            { id: 0, name: '🟢 Data Savers', color: 0x22c55e, hex: '#22c55e', score: 0, pos: 0 },
            { id: 1, name: '🔵 Commit Clan', color: 0x3b82f6, hex: '#3b82f6', score: 0, pos: 0 },
            { id: 2, name: '🟡 Rollback Rollers', color: 0xeab308, hex: '#eab308', score: 0, pos: 0 },
            { id: 3, name: '🔴 Savepoint Squad', color: 0xef4444, hex: '#ef4444', score: 0, pos: 0 },
            { id: 4, name: '👑 Mestres DB', color: 0xa855f7, hex: '#a855f7', score: 0, pos: 0 }
        ];

        const challenges = [
            {
                type: 'input',
                q: "Para iniciar um lote de registros de vendas de Natal na Loja Estrela sem aplicar as alterações imediatamente no banco, qual instrução inicia este bloco de transação?",
                answer: ["begin", "begin;"],
                hint: "Instrução SQL que isola a sessão atual em modo de rascunho até que seja explicitamente encerrada.",
                explanation: "O comando <b>BEGIN</b> inicia formalmente um bloco de transação. A partir deste momento, todas as alterações ficam em modo de 'rascunho' visíveis apenas para a sua própria sessão, até que sejam confirmadas com COMMIT ou descartadas com ROLLBACK."
            },
            {
                type: 'input',
                q: "Ao finalizar o fechamento do caixa diário da Loja Estrela, qual instrução garante a gravação definitiva e durável de todos os lançamentos?",
                answer: ["commit", "commit;"],
                hint: "Garante a propriedade de Durabilidade (propriedade D do ACID), consolidando as alterações no disco.",
                explanation: "O comando <b>COMMIT</b> confirma permanentemente as operações pendentes do bloco transacional no disco. Após o COMMIT, a alteração se torna durável e fica visível para todos os outros usuários do banco."
            },
            {
                type: 'input',
                q: "Se ocorrer um erro de processamento na listagem de produtos da Loja Estrela durante uma transação aberta, qual comando anula tudo o que foi alterado na sessão?",
                answer: ["rollback", "rollback;"],
                hint: "Comando responsável por restaurar a visibilidade da tabela ao estado exatamente anterior ao bloco 'BEGIN'.",
                explanation: "O comando <b>ROLLBACK</b> anula e descarta todas as alterações realizadas dentro da transação atual. O banco de dados retorna exatamente ao estado idêntico ao instante anterior à execução do comando BEGIN."
            },
            {
                type: 'input',
                q: "Em uma venda complexa com múltiplos itens na Loja Estrela, qual recurso cria um marcador intermediário para que um erro em um único item não cancele a compra inteira?",
                answer: ["savepoint", "savepoint;"],
                hint: "Permite controle fino de rollback parcial dentro de uma mesma transação ativa.",
                explanation: "O <b>SAVEPOINT</b> marca uma estaca intermediária na transação. Isso permite desfazer apenas parte do trabalho com ROLLBACK TO SAVEPOINT sem perder o que já havia sido processado com sucesso anterior."
            },
            {
                type: 'input',
                q: "O operador do caixa precisa importar a tabela de fornecedores da Loja Estrela diretamente de um arquivo no computador local através do psql. Qual meta-comando ele deve executar?",
                answer: ["\\copy", "copy", "\\copy;", "copy;"],
                hint: "Trata-se de um utilitário do lado do cliente do psql (iniciado por caractere de escape), diferindo do comando SQL executado no servidor.",
                explanation: "O meta-comando <b>\\copy</b> executa no lado do cliente psql. Diferente do COPY SQL puro, o \\copy lê e grava arquivos de texto/CSV direto no computador do próprio usuário."
            },
            {
                type: 'input',
                q: "Qual ferramenta em linha de comando é utilizada pelo administrador da Loja Estrela para gerar uma cópia de segurança (backup lógico) consistente de todo o banco PostgreSQL?",
                answer: ["pg_dump", "pg dump"],
                hint: "Utilitário nativo executado fora do SQL que extrai definições de esquema e dados em scripts ou formatos binários.",
                explanation: "O <b>pg_dump</b> é o utilitário nativo de backup lógico do PostgreSQL. Ele tira uma foto consistente dos dados sem bloquear leituras ou escritas que estejam ocorrendo simultaneamente."
            },
            {
                type: 'tf',
                q: "Um operador da Loja Estrela executou um COMMIT após atualizar o estoque. Se ele executar ROLLBACK logo em seguida na mesma janela, o estoque voltará ao valor anterior.",
                answer: false,
                hint: "Analise se o ciclo de vida da transação continua ativo após a instrução de consolidação de dados.",
                explanation: "<b>FALSO!</b> Uma vez executado o COMMIT, os dados são gravados permanentemente no banco. O ROLLBACK só funciona enquanto a transação estiver aberta (antes do COMMIT)."
            },
            {
                type: 'tf',
                q: "Em uma compra na Loja Estrela, a falha ao autorizar o pagamento no sistema bancário dispara um ROLLBACK, garantindo que o estoque reservado não seja baixado incorretamente.",
                answer: true,
                hint: "Avalie como a propriedade de Atomicidade (tudo ou nada) do protocolo ACID trata erros em transações financeiras.",
                explanation: "<b>VERDADEIRO!</b> O princípio da <i>Atomicidade</i> garante que uma transação aconteça por inteiro ou não aconteça nada ('tudo ou nada'). Se o pagamento falhar, o ROLLBACK reverte a baixa no estoque automaticamente."
            },
            {
                type: 'tf',
                q: "A instrução ROLLBACK TO SAVEPOINT desfaz apenas os comandos executados após o marcador indicado, mantendo intactas as inserções bem-sucedidas anteriores.",
                answer: true,
                hint: "Considere se o ponto de salvamento cancela o bloco transacional por completo ou de forma pontual.",
                explanation: "<b>VERDADEIRO!</b> O comando ROLLBACK TO SAVEPOINT cancela apenas o trecho de código executado após o ponto marcado, preservando o progresso transacional anterior até o desfecho final com o COMMIT."
            },
            {
                type: 'input',
                q: "Qual utilitário de terminal deve ser chamado para reinstalar a base de dados da Loja Estrela a partir de um arquivo de backup compilado em formato customizado (.dump)?",
                answer: ["pg_restore", "pg restore"],
                hint: "Ferramenta de restauração capaz de reprocessar backups binários e realizar operações concorrentes de reconstrução de tabelas.",
                explanation: "O utilitário <b>pg_restore</b> pega os arquivos comprimidos (.dump/.dir) gerados pelo pg_dump e reconstrói o banco de dados."
            },
            {
                type: 'tf',
                q: "Arquivos no formato CSV exigem obrigatoriamente a instalação de um SGBD completo para que seu conteúdo textual possa ser inspecionado.",
                answer: false,
                hint: "Reflita sobre a estrutura física interna de um arquivo estruturado com delimitadores simples.",
                explanation: "<b>FALSO!</b> O CSV (Comma-Separated Values) é um formato de texto simples e extremamente leve. Ele pode ser aberto em qualquer bloco de notas ou softwares de planilha."
            },
            {
                type: 'input',
                q: "Qual é o formato de arquivo padrão em texto plano, cujos campos são delimitados por vírgulas, amplamente utilizado para migração de relatórios na Loja Estrela?",
                answer: ["csv", ".csv"],
                hint: "Formato universal de intercâmbio de dados cujas colunas são separadas por caracteres de pontuação padrão.",
                explanation: "<b>CSV</b> significa 'Comma-Separated Values'. É o formato padrão universal mais utilizado para migração e troca rápida de dados."
            }
        ];

        let shuffledChallenges = [...challenges].sort(() => Math.random() - 0.5);

        // --- GAME STATE ---
        const BOARD_SIZE = 25;
        let currentTeamIndex = 0;
        let isMoving = false;
        let currentChallenge = null;
        let currentPointsVal = 100;
        let boardPath = [];
        let countdownTimer = null;
        let timeLeft = 45;

        // --- MAP GENERATION ---
        const tileData = new Array(BOARD_SIZE).fill('normal');
        tileData[4] = 'trap'; tileData[10] = 'trap'; tileData[16] = 'trap'; tileData[21] = 'trap';
        tileData[7] = 'boost'; tileData[14] = 'boost'; tileData[19] = 'boost';

        // --- WEB AUDIO API ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'roll') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'move') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'correct') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554, now + 0.1);
                osc.frequency.setValueAtTime(659, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'wrong' || type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'win') {
                osc.type = 'sine';
                [523, 659, 783, 1046].forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'square'; o.frequency.value = f;
                    o.connect(g); g.connect(audioCtx.destination);
                    g.gain.setValueAtTime(0, now + i*0.1);
                    g.gain.linearRampToValueAtTime(0.1, now + i*0.1 + 0.05);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.5);
                    o.start(now + i*0.1); o.stop(now + i*0.1 + 0.5);
                });
            } else if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        // --- THREE.JS SETUP OPTIMIZED FOR 60 FPS ---
        let scene, camera, renderer;
        let pieceMeshes = [];
        let galaxy;
        let activeParticles = [];
        let cameraTargetPos = new THREE.Vector3(0, 32, 42);
        let cameraLookTarget = new THREE.Vector3(0, 0, 2);
        let currentCamPos = new THREE.Vector3(0, 32, 42);
        let currentCamLook = new THREE.Vector3(0, 0, 2);

        function init3D() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 32, 42);
            camera.lookAt(0, 0, 2);

            // Optimized Renderer Configuration
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1.0);
            renderer.shadowMap.enabled = false;

            // Simplified Ambient & Directional Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(15, 30, 15);
            scene.add(dirLight);

            const pLight1 = new THREE.PointLight(0xec4899, 1.5, 80);
            pLight1.position.set(-15, 20, 15);
            scene.add(pLight1);
            
            const pLight2 = new THREE.PointLight(0x38bdf8, 1.5, 80);
            pLight2.position.set(15, 20, -15);
            scene.add(pLight2);

            buildBoard();
            buildPieces();
            createGalaxy();

            window.addEventListener('resize', onWindowResize, false);
            animate3D();
        }

        function buildBoard() {
            const tileGeo = new THREE.BoxGeometry(3.2, 0.8, 3.2);
            
            let cx = -15, cz = -15;
            let dirX = 1;
            
            for (let i = 0; i < BOARD_SIZE; i++) {
                boardPath.push(new THREE.Vector3(cx, 0, cz));
                
                let color = 0x1e3a8a;
                let emissive = 0x0a192f;
                if (i === 0) { color = 0x22c55e; emissive = 0x116633; }
                else if (i === BOARD_SIZE - 1) { color = 0xeab308; emissive = 0x886600; }
                else if (tileData[i] === 'trap') { color = 0xef4444; emissive = 0x880000; }
                else if (tileData[i] === 'boost') { color = 0x22c55e; emissive = 0x008800; }
                else if (i % 2 === 0) { color = 0x4a044e; emissive = 0x220022; }

                const mat = new THREE.MeshStandardMaterial({ 
                    color: color, 
                    emissive: emissive,
                    roughness: 0.2,
                    metalness: 0.7
                });
                
                const tile = new THREE.Mesh(tileGeo, mat);
                tile.position.copy(boardPath[i]);
                tile.position.y = Math.sin(i * 0.3) * 0.15;
                
                const rimGeo = new THREE.BoxGeometry(3.4, 0.2, 3.4);
                const rimMat = new THREE.MeshStandardMaterial({ 
                    color: color, 
                    emissive: color, 
                    emissiveIntensity: 0.8 
                });
                const rimTile = new THREE.Mesh(rimGeo, rimMat);
                rimTile.position.copy(tile.position);
                rimTile.position.y -= 0.35;
                
                scene.add(tile);
                scene.add(rimTile);

                if (dirX === 1) {
                    cx += 4;
                    if (cx > 15) { dirX = 0; cz += 4; }
                } else if (dirX === 0) {
                    dirX = -1; cz += 4;
                } else if (dirX === -1) {
                    cx -= 4;
                    if (cx < -15) { dirX = 2; cz += 4; }
                } else if (dirX === 2) {
                    dirX = 1; cz += 4;
                }
            }
        }

        function buildPieces() {
            const baseGeo = new THREE.CylinderGeometry(0.8, 1.0, 0.4, 12);
            const bodyGeo = new THREE.ConeGeometry(0.65, 1.8, 12);
            const headGeo = new THREE.SphereGeometry(0.45, 12, 12);
            
            bodyGeo.translate(0, 1.1, 0);
            headGeo.translate(0, 2.1, 0);

            teamsData.forEach((team, idx) => {
                const mat = new THREE.MeshStandardMaterial({ 
                    color: team.color,
                    roughness: 0.3,
                    metalness: 0.7
                });

                const pawn = new THREE.Group();
                const baseMesh = new THREE.Mesh(baseGeo, mat);
                const bodyMesh = new THREE.Mesh(bodyGeo, mat);
                const headMesh = new THREE.Mesh(headGeo, mat);

                pawn.add(baseMesh);
                pawn.add(bodyMesh);
                pawn.add(headMesh);
                
                const offset = getPieceOffset(idx);
                const startPos = boardPath[0].clone().add(offset);
                pawn.position.copy(startPos);
                
                scene.add(pawn);
                pieceMeshes.push(pawn);
            });
        }

        function getPieceOffset(index) {
            const offsets = [
                new THREE.Vector3(-0.55, 0.5, -0.55),
                new THREE.Vector3(0.55, 0.5, -0.55),
                new THREE.Vector3(-0.55, 0.5, 0.55),
                new THREE.Vector3(0.55, 0.5, 0.55),
                new THREE.Vector3(0, 0.5, 0)
            ];
            return offsets[index % offsets.length];
        }

        function triggerRollZoom() {
            const pawn = pieceMeshes[currentTeamIndex];
            if (!pawn) return;
            cameraTargetPos.set(pawn.position.x, pawn.position.y + 11, pawn.position.z + 14);
            cameraLookTarget.copy(pawn.position);
        }

        function trackMovingPawn(pos) {
            cameraTargetPos.set(pos.x, pos.y + 11, pos.z + 14);
            cameraLookTarget.copy(pos);
        }

        function resetCameraView() {
            cameraTargetPos.set(0, 32, 42);
            cameraLookTarget.set(0, 0, 2);
        }

        function createGalaxy() {
            const particleCount = 600;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(particleCount * 3);
            
            for(let i = 0; i < particleCount; i++) {
                pos[i*3] = (Math.random() - 0.5) * 140;
                pos[i*3+1] = (Math.random() - 0.5) * 50 - 20;
                pos[i*3+2] = (Math.random() - 0.5) * 140 - 20;
            }
            
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            
            const mat = new THREE.PointsMaterial({ 
                size: 0.6, 
                color: 0x38bdf8,
                transparent: true, 
                opacity: 0.35
            });
            
            galaxy = new THREE.Points(geo, mat);
            scene.add(galaxy);
        }

        function create3DExplosion(position) {
            playSound('explosion');
            const particleCount = 18;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = [];

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = position.x;
                positions[i * 3 + 1] = position.y + 0.5;
                positions[i * 3 + 2] = position.z;

                velocities.push(new THREE.Vector3(
                    (Math.random() - 0.5) * 0.7,
                    Math.random() * 0.9 + 0.2,
                    (Math.random() - 0.5) * 0.7
                ));
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0xef4444, size: 0.55, transparent: true, opacity: 1 });
            const pSystem = new THREE.Points(geo, mat);
            scene.add(pSystem);

            activeParticles.push({ system: pSystem, velocities: velocities, life: 1.0 });
        }

        function updateExplosions() {
            for (let i = activeParticles.length - 1; i >= 0; i--) {
                const item = activeParticles[i];
                item.life -= 0.06;

                if (item.life <= 0) {
                    scene.remove(item.system);
                    item.system.geometry.dispose();
                    item.system.material.dispose();
                    activeParticles.splice(i, 1);
                    continue;
                }

                item.system.material.opacity = item.life;
                const posArr = item.system.geometry.attributes.position.array;

                for (let j = 0; j < item.velocities.length; j++) {
                    posArr[j * 3] += item.velocities[j].x;
                    posArr[j * 3 + 1] += item.velocities[j].y;
                    posArr[j * 3 + 2] += item.velocities[j].z;
                    item.velocities[j].y -= 0.035;
                }

                item.system.geometry.attributes.position.needsUpdate = true;
            }
        }

        function animate3D() {
            requestAnimationFrame(animate3D);

            currentCamPos.lerp(cameraTargetPos, 0.08);
            currentCamLook.lerp(cameraLookTarget, 0.08);

            camera.position.copy(currentCamPos);
            camera.lookAt(currentCamLook);

            if (galaxy) galaxy.rotation.y += 0.0006;
            updateExplosions();

            pieceMeshes.forEach((mesh, idx) => {
                const offset = getPieceOffset(idx);
                const targetPos = boardPath[teamsData[idx].pos].clone().add(offset);
                
                if (!isMoving && idx === currentTeamIndex) {
                    mesh.rotation.y += 0.04;
                    mesh.position.y = targetPos.y + 0.4 + Math.sin(Date.now() * 0.006) * 0.18;
                } else if (!isMoving) {
                    mesh.rotation.y = 0;
                    mesh.position.y = targetPos.y;
                }

                if (!isMoving) {
                    mesh.position.x = targetPos.x;
                    mesh.position.z = targetPos.z;
                }
            });

            renderer.render(scene, camera);
        }

        // --- GAME LOGIC ---

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function startTimer() {
            clearInterval(countdownTimer);
            timeLeft = 45;
            const timerEl = document.getElementById('challenge-timer');
            timerEl.classList.remove('hidden', 'border-red-500', 'text-red-500');
            timerEl.classList.add('border-cyan-500', 'text-cyan-400');
            timerEl.innerText = timeLeft;

            countdownTimer = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;

                if (timeLeft <= 10) {
                    playSound('tick');
                    timerEl.classList.remove('border-cyan-500', 'text-cyan-400');
                    timerEl.classList.add('border-red-500', 'text-red-500');
                }

                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    handleTimeout();
                }
            }, 1000);
        }

        function rollDice() {
            if (isMoving) return;
            initAudio();

            const btn = document.getElementById('btn-roll-dice');
            btn.disabled = true;

            triggerRollZoom();

            const diceEl = document.getElementById('dice-result');
            let rollCount = 0;
            
            const rollInterval = setInterval(() => {
                const tempRoll = Math.floor(Math.random() * 4) + 1;
                diceEl.innerText = tempRoll;
                playSound('roll');
                rollCount++;

                if (rollCount > 8) {
                    clearInterval(rollInterval);
                    const finalRoll = Math.floor(Math.random() * 4) + 1;
                    diceEl.innerText = finalRoll;
                    movePieceStepByStep(finalRoll);
                }
            }, 80);
        }

        function movePieceStepByStep(stepsRemaining) {
            isMoving = true;
            const team = teamsData[currentTeamIndex];
            const pawnMesh = pieceMeshes[currentTeamIndex];

            if (stepsRemaining <= 0 || team.pos >= BOARD_SIZE - 1) {
                isMoving = false;

                if (pawnMesh) {
                    trackMovingPawn(pawnMesh.position);
                }

                // First place finish bonus (+50 points)
                if (team.pos >= BOARD_SIZE - 1) {
                    team.pos = BOARD_SIZE - 1;
                    team.score += 50; // Continuous cumulative score bonus
                    updateScoreboard();
                    triggerEndGame();
                    return;
                }

                setTimeout(() => {
                    const tileType = tileData[team.pos];
                    if (tileType === 'trap') {
                        if (pawnMesh) create3DExplosion(pawnMesh.position);
                        triggerEventModal('trap', 'FALHA DE ENERGIA!', 'O servidor reiniciou e corrompeu a transação!', -50);
                    } else if (tileType === 'boost') {
                        triggerEventModal('boost', 'BACKUP CONCLUÍDO!', 'Exportação rápida finalizada com sucesso via \\copy!', 50);
                    } else {
                        triggerChallenge();
                    }
                }, 400);
                return;
            }

            team.pos++;
            playSound('move');
            updateScoreboard();

            if (pawnMesh) {
                const offset = getPieceOffset(currentTeamIndex);
                const nextTilePos = boardPath[team.pos].clone().add(offset);
                pawnMesh.position.copy(nextTilePos);
                trackMovingPawn(pawnMesh.position);
            }

            setTimeout(() => {
                movePieceStepByStep(stepsRemaining - 1);
            }, 450);
        }

        function triggerChallenge() {
            if (shuffledChallenges.length === 0) {
                shuffledChallenges = [...challenges].sort(() => Math.random() - 0.5);
            }

            document.getElementById('points-badge').classList.remove('hidden');

            document.getElementById('challenge-question').innerText = currentChallenge.q;
            document.getElementById('challenge-points').innerText = currentPointsVal;

            btnHint.disabled = false;

            document.getElementById('btn-continue').classList.add('hidden');

        function useHint() {
            if (!currentChallenge || !currentChallenge.hint) return;
            initAudio();
            playSound('tick');

            currentPointsVal = 60;
            document.getElementById('challenge-points').innerText = currentPointsVal;
            
            const hintBox = document.getElementById('hint-display');
            hintBox.innerText = `💡 DICA: ${currentChallenge.hint}`;

        function submitInputAnswer() {
            clearInterval(countdownTimer);
            initAudio();

            tfBtns.forEach(b => b.disabled = true);

        function updateTurnUI() {
            const team = teamsData[currentTeamIndex];
            const display = document.getElementById('current-team-display');
            display.innerText = team.name;

            document.querySelectorAll('.score-row').forEach(row => row.classList.remove('active-turn'));

        }

        function updateScoreboard() {
            const list = document.getElementById('scoreboard-list');
            list.innerHTML = '';

            const sorted = [...teamsData].sort((a, b) => b.score - a.score || b.pos - a.pos);

            sorted.forEach((team) => {
                const row = document.createElement('div');
                row.id = `score-row-${team.id}`;
                row.className = `score-row flex justify-between items-center p-2.5 rounded-lg text-sm font-fira border border-white/10 ${team.id === teamsData[currentTeamIndex].id ? 'active-turn' : 'bg-black/30'}`;
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full shadow-[0_0_8px_${team.hex}]" style="background-color: ${team.hex}"></span>
                        <span class="font-bold text-gray-100">${team.name}</span>
                    </div>
                    <div class="flex gap-3">
                        <span class="text-xs text-cyan-300/80">Casa ${team.pos + 1}</span>
                        <span class="font-bold text-yellow-400 drop-shadow-[0_0_6px_rgba(234,179,8,0.5)]">${team.score} pts</span>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        function triggerEndGame() {
            clearInterval(countdownTimer);
            playSound('win');

            const sorted = [...teamsData].sort((a, b) => b.score - a.score || b.pos - a.pos);
            const podiumList = document.getElementById('podium-list');
            podiumList.innerHTML = '';

            const medals = ['🥇', '🥈', '🥉', '4º', '5º'];

            sorted.forEach((team, idx) => {
                const row = document.createElement('div');
                row.className = `flex justify-between items-center p-3 rounded-xl border ${idx === 0 ? 'bg-yellow-500/20 border-yellow-500 text-yellow-300 font-bold scale-105 shadow-[0_0_20px_rgba(234,179,8,0.4)]' : 'bg-black/50 border-white/10 text-gray-200'}`;
                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">${medals[idx]}</span>
                        <span class="w-3 h-3 rounded-full shadow-[0_0_8px_${team.hex}]" style="background-color: ${team.hex}"></span>
                        <span class="font-orbitron">${team.name}</span>
                    </div>
                    <span class="font-fira font-bold text-lg ${idx === 0 ? 'text-yellow-400' : 'text-cyan-400'}">${team.score} PTS</span>
                `;
                podiumList.appendChild(row);
            });

            document.getElementById('endgame-modal').classList.remove('hidden');
        }

        function startGame() {
            initAudio();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('turn-indicator').classList.remove('hidden');
            document.getElementById('btn-roll-dice').classList.remove('hidden');
            document.getElementById('dice-result').classList.remove('hidden');

            updateScoreboard();
            updateTurnUI();
            init3D();
        }
    </script>
</body>
</html>
